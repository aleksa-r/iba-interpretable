# r8 fixed IBA formulas (docs/R8_EXPERT_FORMULAS.md). One conjunction of at most two literals
# per group, identical for every target; every predicate uses the LONGER z-score window of the run.
# DISCLOSURE: written by the Dell Claude session (not a human domain expert) AFTER the r6/r7 results
# had been seen; generic textbook "benign / risk-on" statements, not copied from any searched selection.
panel: monthly
groups:
  IR:   [[T10Y2Y_CHG, high], [TB3MS_CHG, not_high]]
  B:    [[BAMLH0A2HYBEY_CHG, not_high], [BAMLEMCBPIEY_CHG, not_high]]
  V:    [[VIXCLS, not_high], [EMVFINCRISES, not_high]]
  AP:   [[Mkt_RF, high], [MSCIEM, high]]
  TF:   [[PTFSSTK, not_high], [PTFSBD, not_high]]
  ST:   [[MOM, high], [ST_REV, not_high]]
  FX:   [[AUDUSD_RET, high], [USDJPY_RET, high]]
  COM:  [[WTI_RET, high], [COPPER_RET, high]]
  MC:   [[NFCI, not_high], [STLFSI, not_high]]
  ENDG: [[__target__, high]]
